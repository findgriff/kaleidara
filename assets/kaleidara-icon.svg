<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Kaleidara icon</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48E0C0"/>
      <stop offset="0.55" stop-color="#8578FF"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#02080B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#07171B"/>
  <g transform="translate(256 256)" filter="url(#shadow)">
    <circle r="180" fill="#0D262B" stroke="url(#ring)" stroke-width="14"/>
    <g fill="#46D7C0" stroke="#DDFEF6" stroke-opacity="0.72" stroke-width="4">
      <path id="petal" d="M0,-153 C30,-123 42,-84 0,-22 C-42,-84 -30,-123 0,-153Z"/>
      <use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/>
    </g>
    <circle r="43" fill="#07171B" stroke="#FFD166" stroke-width="9"/>
    <circle r="14" fill="#FFD166"/>
  </g>
</svg>
