<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Kaleidara logo</title>
  <desc id="desc">A teal, violet and gold radial rosette beside the Kaleidara wordmark.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48E0C0"/>
      <stop offset="0.52" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63F3D2"/>
      <stop offset="0.55" stop-color="#8578FF"/>
      <stop offset="1" stop-color="#D96CFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02080B" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="72" fill="#07171B"/>
  <g transform="translate(260 260)" filter="url(#shadow)">
    <circle r="184" fill="#0D262B" stroke="url(#ring)" stroke-width="12"/>
    <g fill="#46D7C0" stroke="#DDFEF6" stroke-opacity="0.72" stroke-width="4">
      <path id="p" d="M0,-155 C30,-125 42,-84 0,-22 C-42,-84 -30,-125 0,-155Z"/>
      <use href="#p" transform="rotate(45)"/><use href="#p" transform="rotate(90)"/><use href="#p" transform="rotate(135)"/>
      <use href="#p" transform="rotate(180)"/><use href="#p" transform="rotate(225)"/><use href="#p" transform="rotate(270)"/><use href="#p" transform="rotate(315)"/>
    </g>
    <circle r="42" fill="#07171B" stroke="#FFD166" stroke-width="8"/>
    <circle r="13" fill="#FFD166"/>
  </g>
  <g transform="translate(520 174)">
    <text x="0" y="132" fill="#F4FFFC" font-family="Avenir Next, Montserrat, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="2">Kaleidara</text>
    <text x="4" y="188" fill="#72E6CF" font-family="Avenir Next, Montserrat, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3">CREATE · COLOUR · PUBLISH</text>
  </g>
</svg>
